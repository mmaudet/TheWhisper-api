  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-faster-whisper]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Summary
        run: |
          echo "✅ Docker image built and pushed successfully to Docker Hub!"
          echo ""
          echo "📦 Image available at:"
          echo "  - https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "🐳 Pull commands:"
          echo "  docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "  docker pull ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:cuda"
