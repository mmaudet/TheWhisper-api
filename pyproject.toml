[project]
name = "thewhisper-api"
version = "0.1.0"
description = "Real-time speech-to-text API backend using MLX-Whisper on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Twake Assistant Team" }
]
keywords = ["whisper", "speech-to-text", "mlx", "apple-silicon", "transcription"]

dependencies = [
    # Web Framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",

    # MLX Whisper (Apple Silicon)
    "mlx==0.25.2",
    "mlx-whisper==0.4.0",

    # Audio Processing
    "numpy==1.26.4",
    "librosa==0.10.2.post1",

    # Utilities
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
